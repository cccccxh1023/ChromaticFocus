name: Export patched source

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct current patched source
        run: |
          set -euo pipefail
          cat Source/ChromaticFocus-source.zip.b64.* | base64 -D > ChromaticFocus-source.zip
          mkdir SourceTree
          ditto -x -k ChromaticFocus-source.zip SourceTree
          patch -d SourceTree -p1 < Patches/xcode15-compat.patch
          patch -d SourceTree -p1 < Patches/visible-window.patch
          patch -d SourceTree -p1 < Patches/bilingual-interface.patch
          ditto -c -k --sequesterRsrc --keepParent SourceTree PatchedSource.zip

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: ChromaticFocus-patched-source
          path: PatchedSource.zip
          if-no-files-found: error
          retention-days: 1
